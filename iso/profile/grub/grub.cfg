set default="0"
set timeout=5
set gfxmode=auto
set color_normal="#F4F7FB/#0B1020"
set color_highlight="#FF6B2C/#12182B"

insmod all_video
insmod gfxterm
insmod png
insmod gfxmenu

terminal_input console
terminal_output gfxterm

loadfont unicode

menuentry "ForxoOS (x86_64)" {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=FORXOOS_2026
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry "ForxoOS (x86_64 - Copy to RAM)" {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=FORXOOS_2026 copytoram
    initrd /arch/boot/x86_64/initramfs-linux.img
}