UI vesamenu.c32
MENU TITLE DevSecArch Linux
MENU BACKGROUND splash.png
MENU COLOR 4 49;44 #ff d700 #000000 std
MENU COLOR 7;32 40 #ff0000 #000000 msg
MENU COLOR 1 37;40 #000000 #00a000 sel
MENU COLOR 30 37;40 #000000 #00a000 sel
MENU COLOR 38;37;40 #000000 #00a000 sel
MENU COLOR 47;40 #d70000 #000000 std
MENU COLOR 48 40 #ff0000 #000000 std
MENU WIDTH 80
MENU MARGIN 4
MENU MSGSMSG 15
MENU VSHIFT 8
MENU HSHIFT 20
MENU TABMSG Press ENTER to boot or TAB to edit a command line.
MENU AUTOBOOT DevSecArch will boot in #F{seconds} seconds...

DEFAULT arch
TIMEOUT 50

LABEL arch
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=arch archisolabel=DEVSECARCH_2026
    MENU LABEL ^DevSecArch Linux (x86_64)

LABEL arch-copytoram
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=arch archisolabel=DEVSECARCH_2026 copytoram
    MENU LABEL ^DevSecArch Linux (x86_64 - Copy to RAM)

LABEL arch-nvidia
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=arch archisolabel=DEVSECARCH_2026 modules=modprobe.d:*.conf
    MENU LABEL DevSecArch Linux (x86_64 - Load ^NVIDIA)

LABEL memtest
    LINUX /arch/boot/x86_64/memtest
    MENU LABEL ^Memory Test
