UI vesamenu.c32
MENU TITLE ForxoOS
MENU COLOR 4 49;44 #ff6b2c #0b1020 std
MENU COLOR 7;32 40 #ffb347 #0b1020 msg
MENU COLOR 1 37;40 #0b1020 #ff6b2c sel
MENU COLOR 30 37;40 #0b1020 #ff6b2c sel
MENU WIDTH 80
MENU MARGIN 4
MENU MSGSMSG 15
MENU VSHIFT 8
MENU HSHIFT 20
MENU TABMSG Press ENTER to boot or TAB to edit a command line.
MENU AUTOBOOT ForxoOS will boot in #F{seconds} seconds...

DEFAULT arch
TIMEOUT 50

LABEL arch
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=arch archisolabel=FORXOOS_2026
    MENU LABEL ^ForxoOS (x86_64)

LABEL arch-copytoram
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=arch archisolabel=FORXOOS_2026 copytoram
    MENU LABEL ^ForxoOS (x86_64 - Copy to RAM)

LABEL memtest
    LINUX /arch/boot/x86_64/memtest
    MENU LABEL ^Memory Test
