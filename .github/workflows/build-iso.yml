name: Build DevSecArch ISO

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    timeout-minutes: 120

    steps:
      - name: Free disk space
        run: |
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git grub dosfstools mtools syslinux xz

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISO
        run: mkarchiso -v -w work -o out iso/profile

      - name: Compress ISO
        run: |
          cd out
          for iso in *.iso; do
            xz -9 --threads=0 "$iso"
          done

      - name: Get version
        id: version
        run: echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: DevSecArch ${{ steps.version.outputs.date }}
          files: out/*.iso.xz
          make_latest: true
          body: |
            DevSecArch Linux - Deepin Desktop
            Built: ${{ github.sha }}
            Date: ${{ steps.version.outputs.date }}
            Extract .xz to get .iso
