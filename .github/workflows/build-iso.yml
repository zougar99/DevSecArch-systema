name: Build DevSecArch ISO

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    timeout-minutes: 120

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git grub dosfstools mtools

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISO
        run: mkarchiso -v -w work -o out iso/profile

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: DevSecArch-${{ github.sha }}
          path: out/*.iso
          retention-days: 30
