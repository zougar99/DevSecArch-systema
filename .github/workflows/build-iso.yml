name: Build DevSecArch ISO

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    timeout-minutes: 120

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git grub dosfstools mtools syslinux

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISO
        run: mkarchiso -v -w work -o out iso/profile

      - name: Get version
        id: version
        run: echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: DevSecArch ${{ steps.version.outputs.date }}
          files: out/*.iso
          make_latest: true
          body: |
            DevSecArch Linux ISO
            Built: ${{ github.sha }}
            Date: ${{ steps.version.outputs.date }}
