name: Build DevSecArch ISO

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    timeout-minutes: 120

    steps:
      - name: Free disk space
        run: |
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git grub dosfstools mtools syslinux

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISO
        run: mkarchiso -v -w work -o out iso/profile

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: DevSecArch-Deepin-${{ github.sha }}
          path: out/*.iso
          retention-days: 7
          compression-level: 0
